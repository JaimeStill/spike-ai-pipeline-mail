[package]
name = "spike-ai-pipeline-mail"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "The mail CLI of spike-ai-pipeline: Outlook .pst stores and .msg messages to a JSON model"
repository = "https://github.com/JaimeStill/spike-ai-pipeline-mail"
publish = false

[dependencies]
# Pinned exactly: the CLI works around known faults of these releases (src/pst.rs).
outlook-pst = "=1.2.0"
codepage-strings = "=1.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
