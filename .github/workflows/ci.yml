# CI runs the check a developer runs, `mise run check`, on every pull request into main and every
# push to main, natively on x64 and arm64, so each runner tests the CLI and builds its own static
# musl release binary. Actions are pinned by full commit SHA, the release's tag in a comment, which
# `mise run currency` compares with each action's latest release. A newer run on the same ref
# cancels the one it supersedes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # mise installs the pinned Rust toolchain, with both musl targets, and shellcheck.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      # The crates Cargo.lock pins, as downloaded; target/ is built fresh on each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: mise run check
        run: mise run check
